  "Voice-first health companion for older people in Hong Kong and their carers, in Cantonese or English",
  "Turns spoken symptoms into a one-page summary for the doctor and flags medicine interactions",
  "Suggests the A&E with the shortest total wait from live Hospital Authority data; it never diagnoses",
]
team_size = 4
tags = ["TypeScript", "Next.js", "Python", "FastAPI", "LLM"]
links = [{ label = "Source", url = "https://github.com/Seungwoo0120/Gen-AI-Hackathon" }]

