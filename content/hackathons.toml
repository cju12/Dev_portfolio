# Sorted newest first. Several projects at one event (e.g. different tracks) count as one hackathon in the stats.
#
# Required: event, project, date ("YYYY-MM"), summary
# Optional: award, host, track, location, team_size (1 shows as "Solo"), tags, links

[[hackathons]]
event = "GenAI Inter-University Hackathon"
project = "CareCompass"
date = "2026-09"
summary = "A voice-first health companion for older people in Hong Kong and their carers. Talk in Cantonese or English to log symptoms into a one-page summary for the doctor, keep a medicine list with interaction warnings, and find the A&E you can be seen at soonest from live Hospital Authority waiting times. It organises and routes; it never diagnoses."
team_size = 4
tags = ["TypeScript", "Next.js", "Python", "FastAPI", "LLM"]
links = [{ label = "Source", url = "https://github.com/Seungwoo0120/Gen-AI-Hackathon" }]

