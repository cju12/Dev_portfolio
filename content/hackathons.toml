# Sorted newest first.
#
# Required: event, project, date ("YYYY-MM"), points (bullet points)
# Optional: award, host, track, location, team_size (1 shows as "Solo"), tags, links,
#           image (event photo or poster in public/images/, shown beside the entry),
#           logo (put the file in public/logos/ → logo = "logos/x.svg"; without it a simple shape is shown)

[[hackathons]]
