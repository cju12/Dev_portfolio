[[projects]]
title = "Choice Overload in a Dating Context"
date = "2026-06"
summary = "A behavioural experiment on whether more options lead to worse choices. Each participant used a dating-style Streamlit app twice, once with 4 profiles and once with 22. Across 25 participants, regret rose from 3.0 to 4.2 (Wilcoxon p = 0.01) while satisfaction stayed about the same."
tags = ["Python", "Streamlit", "Statistics"]
