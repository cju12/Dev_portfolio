<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choi Jinuk | Portfolio</title>
    <meta name="description" content="Choi Jinuk, Computer Science student at The University of Hong Kong. Projects, hackathons and experience." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@300..900&display=swap"
    />
    <!-- Linked here, not imported from main.ts, so the page never paints unstyled while JS loads -->
    <link rel="stylesheet" href="/src/style.css" />
    <script>
      try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
    </script>
  </head>
  <body>
    <header class="nav">
      <a class="brand" id="brand" href="#top"></a>
      <nav class="nav-links" aria-label="Sections">
        <a href="#about">About</a>
        <a href="#projects">Projects</a>
        <a href="#hackathons">Hackathons</a>
        <a href="#experience">Experience</a>
        <a href="#contact">Contact</a>
      </nav>
      <button class="icon-btn" id="theme" type="button" aria-label="Toggle dark mode">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
      </button>
    </header>

    <main id="top">
      <section class="hero">
        <h1><span class="line"><span id="name"></span></span></h1>
        <p class="roles" id="roles"></p>
        <p class="lede reveal" id="tagline" style="--i: 5"></p>
        <div class="actions reveal" style="--i: 6">
          <a class="btn primary" href="#projects">See my work <span aria-hidden="true">→</span></a>
          <a class="btn" href="#contact">Get in touch</a>
          <a class="btn" id="resume" target="_blank" rel="noopener" hidden>Résumé ↗</a>
        </div>
      </section>

      <div class="marquee" id="marquee"></div>

      <section class="section" id="about">
        <h2 class="reveal">Who <em>I am</em></h2>
        <div class="about reveal">
          <img class="photo" id="photo" hidden />
          <div>
            <div class="tabs" id="about-tabs" role="group" aria-label="Choose what to show"></div>
            <div id="about-panels"></div>
          </div>
        </div>
      </section>

      <section class="section" id="projects">
        <h2 class="reveal">Things I've <em>built</em></h2>
        <div class="filters" id="filters" role="toolbar" aria-label="Filter projects by tag"></div>
        <div class="grid" id="project-grid"></div>
      </section>

      <section class="section" id="hackathons">
        <h2 class="reveal">Weekends spent <em>shipping</em></h2>
        <ol class="hack-list" id="hack-list"></ol>
      </section>

      <section class="section" id="experience">
        <h2 class="reveal">Where I've <em>worked</em></h2>
        <ol class="timeline" id="timeline"></ol>
      </section>

      <section class="section" id="contact">
        <div class="contact reveal">
          <h2>Let's build <em>something</em> together.</h2>
          <div class="actions"><a class="btn primary" id="email">Say hello ↗</a></div>
          <div class="socials" id="socials"></div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span id="copyright"></span>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
